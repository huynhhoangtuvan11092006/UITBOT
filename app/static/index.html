<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UITBOT – Trợ lý quy chế đào tạo UIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#27397f;
  --blue:#4a63b5;
  --blue-hover:#384f99;
  --sky:#eaeefa;
  --sky-light:#f4f7fe;
  --ink:#18203f;
  --muted:#5b6b82;
  --line:#dde3f3;
  --card:rgba(255,255,255,.92);
  --error:#e11d48;
  --error-bg:#ffe4e6;
  --success:#16a34a;
  --bg-img:url('bg.jpg');
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);background:#eff2fa;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
}

/* ===== Nền: khuôn viên UIT ===== */
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(24,36,96,.55) 0,rgba(39,57,127,.45) 45%,rgba(24,36,96,.7) 100%),
    var(--bg-img) center/cover no-repeat;
}

/* ===== Header ===== */
header{
  position:relative;z-index:2;color:#fff;
  background:linear-gradient(110deg,var(--navy),#34499a 70%,#4a63b5);
  padding:16px clamp(16px,4vw,40px);display:flex;align-items:center;gap:16px;
  box-shadow:0 6px 24px rgba(39,57,127,.25);
}
.mark{
  width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;
  background:#fff;color:var(--navy);
  box-shadow:0 0 0 4px rgba(255,255,255,.18);
}
.mark img{width:36px;height:auto;display:block}
header h1{font-size:24px;font-weight:800;letter-spacing:.5px;line-height:1.1}
header p{font-size:13.5px;opacity:.9;margin-top:4px}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
.status{
  font-size:13px;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.12);padding:6px 14px;border-radius:99px;
}
.status i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.3)}
.btn-clear{
  font:inherit;font-size:12.5px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
  padding:6px 14px;border-radius:99px;cursor:pointer;transition:.15s;
}
.btn-clear:hover{background:rgba(255,255,255,.25);border-color:#fff}

/* ===== Main Chat Area ===== */
main{
  position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;
  align-items:center;padding:24px 16px 14px;
}
.chat{
  width:min(900px,100%);flex:1;min-height:0;display:flex;flex-direction:column;
  background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.9);border-radius:24px;overflow:hidden;
  box-shadow:0 20px 60px rgba(39,57,127,.16);
}
#messages{
  flex:1;overflow-y:auto;padding:24px clamp(16px,3vw,32px);
  display:flex;flex-direction:column;gap:20px;scroll-behavior:smooth;
}

/* ===== Tin nhắn ===== */
.msg{display:flex;gap:12px;max-width:88%}
.msg .av{
  width:36px;height:36px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--navy);color:#fff;
}
.msg-content-wrap{display:flex;flex-direction:column;gap:6px;max-width:100%}
.msg .bubble{
  padding:14px 18px;border-radius:4px 18px 18px 18px;background:#fff;
  border:1px solid var(--line);line-height:1.6;font-size:15px;color:var(--ink);
  word-break:break-word;box-shadow:0 2px 8px rgba(39,57,127,.04);
}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.user .av{background:var(--sky);color:var(--blue)}
.msg.user .bubble{
  background:var(--blue);color:#fff;border:0;
  border-radius:18px 4px 18px 18px;box-shadow:0 4px 12px rgba(74,99,181,.25);
}

/* Typography trong Bubble */
.bubble p{margin-bottom:8px}
.bubble p:last-child{margin-bottom:0}
.bubble strong{color:inherit;font-weight:700}
.bubble em{font-style:italic}
.bubble code{
  background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;
  font-family:monospace;font-size:.9em;
}
.bubble .msg-list{margin:8px 0 8px 20px;padding:0}
.bubble .msg-list li{margin-bottom:4px}
.bubble .msg-heading{font-size:16px;font-weight:700;margin:12px 0 6px}

/* Con trỏ nhấp nháy khi Streaming */
.cursor{
  display:inline-block;width:2px;height:1em;background:var(--blue);
  vertical-align:middle;margin-left:2px;animation:blink .8s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ===== Thẻ nguồn trích dẫn (Sources) ===== */
.sources-container{
  margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.sources-title{
  font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;
}
.source-pill{
  font-size:13px;color:var(--navy);background:var(--sky);
  border:1px solid #ccd7f5;padding:6px 12px;border-radius:10px;
  display:flex;flex-direction:column;gap:4px;transition:.15s;
}
.source-pill-header{
  display:flex;align-items:center;gap:6px;font-weight:600;
}
.source-pill-header .icon{font-size:14px}
.source-quote-box{
  font-size:12px;color:var(--muted);font-style:italic;
  padding:4px 8px;background:rgba(255,255,255,.6);border-left:3px solid var(--blue);
  border-radius:4px;margin-top:2px;
}

/* ===== Hàng phản hồi Thumbs Up/Down ===== */
.feedback-bar{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  padding:2px 4px;margin-top:2px;
}
.feedback-bar button{
  background:none;border:1px solid var(--line);border-radius:8px;
  padding:3px 8px;cursor:pointer;font-size:13px;transition:.15s;
  color:var(--muted);background:#fff;
}
.feedback-bar button:hover:not(:disabled){
  border-color:var(--blue);background:var(--sky);color:var(--navy);
}
.feedback-bar button.active{
  background:var(--blue);color:#fff;border-color:var(--blue);
}
.feedback-bar button:disabled{cursor:default;opacity:.7}
.feedback-thanks{color:var(--success);font-weight:600}

/* ===== Trạng thái lỗi (Error state) ===== */
.msg.error .bubble{
  background:var(--error-bg);color:var(--error);border-color:#fecdd3;
}
.error-actions{margin-top:8px}
.btn-retry{
  font:inherit;font-size:12px;font-weight:600;background:#fff;color:var(--error);
  border:1px solid var(--error);padding:4px 10px;border-radius:8px;cursor:pointer;transition:.15s;
}
.btn-retry:hover{background:var(--error);color:#fff}

/* ===== Chips gợi ý ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 clamp(16px,3vw,32px) 14px}
.chips button{
  font:inherit;font-size:13.5px;color:var(--navy);background:#fff;border:1px solid var(--line);
  padding:8px 14px;border-radius:99px;cursor:pointer;transition:.15s;
}
.chips button:hover{border-color:var(--blue);background:var(--sky)}

/* Typing loader */
.typing{display:inline-flex;gap:5px;padding:4px 0}
.typing b{width:7px;height:7px;border-radius:50%;background:#9db4d3;animation:bl 1.1s infinite}
.typing b:nth-child(2){animation-delay:.15s}
.typing b:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

/* ===== Form input ===== */
form{
  display:flex;gap:12px;padding:16px clamp(16px,3vw,28px);
  border-top:1px solid var(--line);background:rgba(255,255,255,.75);
}
textarea{
  flex:1;font:inherit;font-size:15px;color:var(--ink);resize:none;height:54px;padding:14px 16px;
  border:1px solid var(--line);border-radius:16px;background:#fff;outline:none;transition:.15s;
}
textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(74,99,181,.15)}
.send{
  font:inherit;font-weight:600;font-size:15px;color:#fff;border:0;border-radius:16px;padding:0 26px;
  cursor:pointer;background:linear-gradient(135deg,#5b75c9,#3a509f);
  box-shadow:0 8px 20px rgba(74,99,181,.3);transition:.15s;
}
.send:hover{transform:translateY(-1px)}
.send:disabled{opacity:.6;cursor:wait;transform:none}
textarea:focus-visible,.send:focus-visible,.chips button:focus-visible{outline:3px solid #9aaee6;outline-offset:2px}

.note{
  position:relative;z-index:1;text-align:center;font-size:12.5px;color:#e8ecfa;
  text-shadow:0 1px 3px rgba(0,0,0,.45);padding:6px 16px 16px;
}

@media (max-width:640px){
  header h1{font-size:20px}
  .status{display:none}
  .msg{max-width:96%}
  .send{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body>

<div class="bg" aria-hidden="true"></div>

<header>
  <div class="mark"><img src="uit-logo.png" alt="UIT"></div>
  <div>
    <h1>UITBOT</h1>
    <p>Trợ lý hỏi đáp quy chế Trường Đại học Công nghệ Thông tin</p>
  </div>
  <div class="header-actions">
    <div class="status"><i></i>Sẵn sàng</div>
    <button type="button" class="btn-clear" id="btn-clear" title="Xóa lịch sử trò chuyện">Làm mới hội thoại</button>
  </div>
</header>

<main>
  <section class="chat">
    <div id="messages">
      <!-- Tin nhắn sẽ được thêm qua JavaScript -->
    </div>
    <div class="chips" id="chips">
      <button type="button">Điều kiện để xét tốt nghiệp?</button>
      <button type="button">Khi nào bị cảnh báo học vụ?</button>
      <button type="button">Quy định hoãn thi khi bị ốm?</button>
      <button type="button">Điều kiện xét tuyển liên thông Thạc sĩ BS-MS?</button>
    </div>
    <form id="form">
      <textarea id="input" placeholder="Nhập câu hỏi quy chế của bạn…" aria-label="Câu hỏi"></textarea>
      <button class="send" id="send" type="submit">Gửi câu hỏi</button>
    </form>
  </section>
</main>
<p class="note">UITBOT trích xuất thông tin trực tiếp từ các quy chế, quy định chính thức của UIT & ĐHQG-HCM.</p>

<script>
/* =========================================================
   UITBOT CLIENT-SIDE APPLICATION SCRIPT
   - Streaming SSE qua POST /api/v1/chat/stream
   - Thẻ nguồn: File - Điều - Trang (kèm trích đoạn)
   - Đánh giá câu trả lời: 👍 / 👎 qua /api/v1/feedback
   - Lịch sử chat lưu trữ an toàn trong localStorage
   - Hiển thị bảo mật XSS tuyệt đối (safe textContent/DOM nodes)
   ========================================================= */

const STORAGE_KEY = 'uitbot_chat_history_v1';
const SESSION_KEY = 'uitbot_session_id';

const box = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const clearBtn = document.getElementById('btn-clear');
const chipsContainer = document.getElementById('chips');

// Khởi tạo Session ID duy nhất
let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = 'sess_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
  localStorage.setItem(SESSION_KEY, sessionId);
}

const WELCOME_MSG = {
  role: 'bot',
  text: 'Xin chào! Mình là UITBOT, trợ lý hỗ trợ tra cứu các quy chế, quy định học vụ tại Trường Đại học Công nghệ Thông tin (ĐHQG-HCM).\n\nBạn có thể hỏi mình về điều kiện tốt nghiệp, học bổng, thi cử, hoãn thi, liên thông thạc sĩ hoặc đào tạo song ngành. Khi có văn bản phù hợp, mình sẽ trích dẫn kèm số Điều và số Trang rõ ràng.',
  sources: []
};

// ---------------------------------------------------------
// Hiển thị nội dung an toàn chống XSS (Safe DOM parser)
// ---------------------------------------------------------
function appendFormattedInline(parent, text) {
  // Regex tách an toàn các định dạng markdown cơ bản: **bold**, *italic*, `code`
  const tokens = text.split(/(\*\*.*?\*\*|\*.*?\*|`.*?`)/g);
  for (const token of tokens) {
    if (token.startsWith('**') && token.endsWith('**') && token.length >= 4) {
      const strong = document.createElement('strong');
      strong.textContent = token.slice(2, -2);
      parent.appendChild(strong);
    } else if (token.startsWith('*') && token.endsWith('*') && token.length >= 2) {
      const em = document.createElement('em');
      em.textContent = token.slice(1, -1);
      parent.appendChild(em);
    } else if (token.startsWith('`') && token.endsWith('`') && token.length >= 2) {
      const code = document.createElement('code');
      code.textContent = token.slice(1, -1);
      parent.appendChild(code);
    } else if (token) {
      parent.appendChild(document.createTextNode(token));
    }
  }
}

function renderSafeMarkdown(container, markdownText) {
  container.textContent = '';
  const lines = markdownText.split('\n');
  let currentP = null;
  let inList = false;
  let listEl = null;

  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) {
      currentP = null;
      inList = false;
      listEl = null;
      continue;
    }

    // Danh sách gạch đầu dòng (- hoặc *)
    const listMatch = line.match(/^([*\-+]|\d+\.)\s+(.+)$/);
    if (listMatch) {
      if (!inList || !listEl) {
        listEl = document.createElement(listMatch[1].endsWith('.') ? 'ol' : 'ul');
        listEl.className = 'msg-list';
        container.appendChild(listEl);
        inList = true;
      }
      const li = document.createElement('li');
      appendFormattedInline(li, listMatch[2]);
      listEl.appendChild(li);
      currentP = null;
      continue;
    }

    inList = false;
    listEl = null;

    // Tiêu đề ## hoặc ###
    const hMatch = line.match(/^(#{1,4})\s+(.+)$/);
    if (hMatch) {
      const level = Math.min(6, hMatch[1].length + 2);
      const h = document.createElement('h' + level);
      h.className = 'msg-heading';
      appendFormattedInline(h, hMatch[2]);
      container.appendChild(h);
      currentP = null;
      continue;
    }

    // Đoạn văn thông thường
    if (!currentP) {
      currentP = document.createElement('p');
      container.appendChild(currentP);
    } else {
      currentP.appendChild(document.createElement('br'));
    }
    appendFormattedInline(currentP, line);
  }
}

// ---------------------------------------------------------
// Render Thẻ nguồn (File – Điều – Trang)
// ---------------------------------------------------------
function renderSources(container, sources) {
  if (!sources || !sources.length) return;

  const wrap = document.createElement('div');
  wrap.className = 'sources-container';

  const title = document.createElement('div');
  title.className = 'sources-title';
  title.textContent = 'Căn cứ quy chế trích dẫn:';
  wrap.appendChild(title);

  sources.forEach(src => {
    const pill = document.createElement('div');
    pill.className = 'source-pill';

    const header = document.createElement('div');
    header.className = 'source-pill-header';

    const icon = document.createElement('span');
    icon.className = 'icon';
    icon.textContent = '📄';

    const textSpan = document.createElement('span');
    let label = src.file || 'Văn bản quy định';
    if (src.article) label += ' – ' + src.article;
    if (src.page) label += ' – Trang ' + src.page;
    textSpan.textContent = label;

    header.append(icon, textSpan);
    pill.appendChild(header);

    // Trích đoạn quote nếu có
    if (src.quote) {
      const quoteBox = document.createElement('div');
      quoteBox.className = 'source-quote-box';
      quoteBox.textContent = '“' + src.quote.trim() + '”';
      pill.appendChild(quoteBox);
    }

    wrap.appendChild(pill);
  });

  container.appendChild(wrap);
}

// ---------------------------------------------------------
// Render Nút phản hồi 👍 / 👎 gọi /api/v1/feedback
// ---------------------------------------------------------
function renderFeedbackBar(container, msgId) {
  if (!container || container.querySelector('.feedback-bar')) return;

  const bar = document.createElement('div');
  bar.className = 'feedback-bar';

  const label = document.createElement('span');
  label.textContent = 'Hữu ích?';

  const btnUp = document.createElement('button');
  btnUp.type = 'button';
  btnUp.textContent = '👍';
  btnUp.title = 'Câu trả lời chính xác, hữu ích';

  const btnDown = document.createElement('button');
  btnDown.type = 'button';
  btnDown.textContent = '👎';
  btnDown.title = 'Chưa chính xác hoặc thiếu thông tin';

  const thanks = document.createElement('span');
  thanks.className = 'feedback-thanks';
  thanks.style.display = 'none';
  thanks.textContent = '✓ Cảm ơn bạn!';

  async function sendFeedback(rating, clickedBtn) {
    btnUp.disabled = true;
    btnDown.disabled = true;
    clickedBtn.classList.add('active');
    thanks.style.display = 'inline';

    try {
      await fetch('/api/v1/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session_id: sessionId,
          message_id: msgId || ('msg_' + Date.now()),
          rating: rating
        })
      });
    } catch (e) {
      console.warn('Feedback submission error:', e);
    }
  }

  btnUp.addEventListener('click', () => sendFeedback(1, btnUp));
  btnDown.addEventListener('click', () => sendFeedback(-1, btnDown));

  bar.append(label, btnUp, btnDown, thanks);
  container.appendChild(bar);
}

// ---------------------------------------------------------
// Thêm tin nhắn vào giao diện
// ---------------------------------------------------------
function addMessage(role, text, sources, isError = false, msgId = null) {
  const m = document.createElement('div');
  m.className = 'msg ' + role + (isError ? ' error' : '');

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = role === 'user' ? 'Bạn' : 'UIT';

  const contentWrap = document.createElement('div');
  contentWrap.className = 'msg-content-wrap';

  const b = document.createElement('div');
  b.className = 'bubble';

  if (isError) {
    b.textContent = text;
  } else {
    renderSafeMarkdown(b, text);
  }

  contentWrap.appendChild(b);

  if (role === 'bot' && !isError) {
    if (sources && sources.length) {
      renderSources(b, sources);
    }
    if (msgId) {
      renderFeedbackBar(contentWrap, msgId);
    }
  }

  m.append(av, contentWrap);
  box.appendChild(m);
  box.scrollTop = box.scrollHeight;
  return { msgElement: m, bubbleElement: b, contentWrap: contentWrap };
}

// ---------------------------------------------------------
// Quản lý lịch sử phía client (localStorage)
// ---------------------------------------------------------
function getStoredHistory() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(messages) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
  } catch (e) {
    console.warn('Could not save history to localStorage:', e);
  }
}

function loadHistory() {
  box.textContent = '';
  const history = getStoredHistory();
  if (!history.length) {
    addMessage(WELCOME_MSG.role, WELCOME_MSG.text, WELCOME_MSG.sources);
    return;
  }
  history.forEach(item => {
    addMessage(item.role, item.text, item.sources, item.isError, item.msgId);
  });
}

// ---------------------------------------------------------
// Xử lý gửi câu hỏi & Streaming SSE qua /api/v1/chat/stream
// ---------------------------------------------------------
async function streamChat(question) {
  const response = await fetch('/api/v1/chat/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question: question, session_id: sessionId })
  });

  if (!response.ok) {
    const errData = await response.json().catch(() => ({}));
    throw new Error(errData.detail || `Lỗi máy chủ (${response.status})`);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  let fullText = '';
  let meta = { sources: [] };

  // Tạo bong bóng bot đang chờ với con trỏ nhấp nháy
  const { bubbleElement, contentWrap } = addMessage('bot', '', []);
  bubbleElement.innerHTML = '<span class="typing"><b></b><b></b><b></b></span>';

  let isFirstToken = true;
  let cursorSpan = null;

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;

    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n\n');
    buffer = lines.pop(); // giữ lại phần chưa hoàn tất

    for (const block of lines) {
      if (!block.trim()) continue;
      let eventType = 'message';
      let eventData = '';

      const rawLines = block.split('\n');
      for (const line of rawLines) {
        if (line.startsWith('event:')) {
          eventType = line.slice(6).trim();
        } else if (line.startsWith('data:')) {
          eventData = line.slice(5).trim();
        }
      }

      try {
        const parsed = JSON.parse(eventData);

        if (eventType === 'status') {
          // Trạng thái đang phân tích
          if (isFirstToken) {
            bubbleElement.textContent = parsed.message || 'Đang tra cứu quy chế...';
          }
        } else if (eventType === 'meta') {
          meta = parsed;
        } else if (eventType === 'token') {
          if (isFirstToken) {
            isFirstToken = false;
            bubbleElement.textContent = '';
            cursorSpan = document.createElement('span');
            cursorSpan.className = 'cursor';
            bubbleElement.appendChild(cursorSpan);
          }
          fullText += parsed.token;
          renderSafeMarkdown(bubbleElement, fullText);
          bubbleElement.appendChild(cursorSpan);
          box.scrollTop = box.scrollHeight;
        } else if (eventType === 'done') {
          if (parsed.answer) fullText = parsed.answer;
          if (parsed.sources) meta.sources = parsed.sources;
        } else if (eventType === 'error') {
          throw new Error(parsed.error || 'Lỗi xử lý luồng streaming');
        }
      } catch (err) {
        if (err.message && err.message.includes('Lỗi')) throw err;
      }
    }
  }

  // Kết thúc stream: gỡ con trỏ nhấp nháy, render đầy đủ markdown và thẻ nguồn
  if (cursorSpan) cursorSpan.remove();
  renderSafeMarkdown(bubbleElement, fullText);

  if (meta.sources && meta.sources.length) {
    renderSources(bubbleElement, meta.sources);
  }

  const msgId = 'msg_' + Date.now();
  renderFeedbackBar(contentWrap, msgId);

  return { answer: fullText, sources: meta.sources, msgId: msgId };
}

// ---------------------------------------------------------
// Submit câu hỏi
// ---------------------------------------------------------
async function submitQuestion(q) {
  q = q.trim();
  if (!q) return;

  chipsContainer.style.display = 'none';
  input.value = '';
  sendBtn.disabled = true;

  // 1. Thêm tin nhắn User vào UI & History
  addMessage('user', q);
  const currentHistory = getStoredHistory();
  currentHistory.push({ role: 'user', text: q });
  saveHistory(currentHistory);

  try {
    // 2. Gọi streaming backend
    const res = await streamChat(q);
    currentHistory.push({
      role: 'bot',
      text: res.answer,
      sources: res.sources,
      msgId: res.msgId
    });
    saveHistory(currentHistory);
  } catch (err) {
    // 3. Xử lý trạng thái lỗi an toàn
    console.error('Chat error:', err);
    const errText = 'Không thể kết nối đến máy chủ hoặc xử lý câu hỏi: ' + (err.message || 'Lỗi không xác định.');
    const { contentWrap } = addMessage('bot', errText, [], true);

    // Thêm nút Thử lại (Retry)
    const retryDiv = document.createElement('div');
    retryDiv.className = 'error-actions';
    const retryBtn = document.createElement('button');
    retryBtn.type = 'button';
    retryBtn.className = 'btn-retry';
    retryBtn.textContent = '🔄 Thử lại';
    retryBtn.addEventListener('click', () => {
      contentWrap.parentElement.remove();
      submitQuestion(q);
    });
    retryDiv.appendChild(retryBtn);
    contentWrap.appendChild(retryDiv);
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

// ---------------------------------------------------------
// Event Listeners
// ---------------------------------------------------------
document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  submitQuestion(input.value);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    submitQuestion(input.value);
  }
});

document.querySelectorAll('#chips button').forEach(b => {
  b.addEventListener('click', () => submitQuestion(b.textContent));
});

clearBtn.addEventListener('click', () => {
  if (confirm('Bạn có chắc muốn xóa lịch sử cuộc trò chuyện này?')) {
    localStorage.removeItem(STORAGE_KEY);
    sessionId = 'sess_' + Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
    localStorage.setItem(SESSION_KEY, sessionId);
    chipsContainer.style.display = 'flex';
    loadHistory();
  }
});

// Khởi chạy
loadHistory();
</script>
