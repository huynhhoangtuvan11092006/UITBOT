services:
  db:
    image: pgvector/pgvector:pg16
    container_name: uitbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uitbot
      POSTGRES_USER: uitbot_user
      POSTGRES_PASSWORD: uitbot_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uitbot_user -d uitbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uitbot-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: uitbot
      POSTGRES_USER: uitbot_user
      POSTGRES_PASSWORD: uitbot_password
      OCR_ENGINE: tesseract
      OPENAI_BASE_URL: http://host.docker.internal:20128/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./evaluation:/app/evaluation
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  hf_cache:
